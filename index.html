<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --c0: #f4c4d4;
        --c1: #ea92ab;
        --c2: #af7fc2;
        --c3: #9085d0;
        --c4: #8c76be;
        --c5: #61567d;
      }

      body {
        margin: 0;
        background-color: var(--c5);

        opacity: 0.8;
        background-image:
          linear-gradient(var(--c3) 1.6px, transparent 1.6px),
          linear-gradient(90deg, var(--c3) 1.6px, transparent 1.6px),
          linear-gradient(var(--c3) 0.8px, transparent 0.8px),
          linear-gradient(90deg, var(--c3) 0.8px, var(--c5) 0.8px);
        background-size:
          80px 80px,
          80px 80px,
          16px 16px,
          16px 16px;
        background-position:
          -1.6px -1.6px,
          -1.6px -1.6px,
          -0.8px -0.8px,
          -0.8px -0.8px;
      }
      svg.i {
        height: 2rem;
        height: 2rem;
        fill: var(--c0);
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>iå</title>
  </head>
  <body class="container">
    <div class="grid">
      <svg class="i" viewBox="0 0 5 5">
        <path
          d="M0 1h1v1H0zM3 4h1v1H3zM4 2h1v3H4zM2 3h1v2H2zM0 3h1v2H0zM3 2h1v1H3zM3 0h1v1H3z"
        />
      </svg>
    </div>
  </body>
</html>
